<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MYCELIUM — Route</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  :root { --bg:#0a0d0c; --ink:#d7e8e2; --ink-dim:#6f8b83; --teal:#35e0c0; --amber:#ffb454; --border:#1c2a26; }
  html, body { margin:0; padding:0; height:100%; background:#060807; color:var(--ink); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
  #navmap { position:absolute; inset:0; }
  #navinfo { position:absolute; top:18px; left:18px; z-index:500; background:rgba(8,12,10,0.88); backdrop-filter:blur(6px);
    border:1px solid var(--border); border-radius:10px; padding:16px 20px; max-width:320px; }
  #navinfo h2 { margin:0 0 4px; font-size:16px; color:var(--teal); text-shadow:0 0 12px rgba(53,224,192,0.4); }
  #navinfo .sub { font-size:10px; color:var(--ink-dim); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px; }
  #navinfo .row { display:flex; justify-content:space-between; gap:16px; font-size:12.5px; padding:3px 0; }
  #navinfo .row .k { color:var(--ink-dim); }
  .maplibregl-popup-content { background:#101513; color:var(--ink); border:1px solid var(--border); border-radius:8px; font-size:12.5px; padding:8px 10px; }
  .maplibregl-popup-tip { border-top-color:#101513 !important; border-bottom-color:#101513 !important; }
  .maplibregl-ctrl-attrib { background:rgba(8,12,10,0.65) !important; color:var(--ink-dim) !important; font-size:9.5px !important; }
  .maplibregl-ctrl-attrib-button { display:none !important; }
</style>
</head>
<body>
<div id="navmap"></div>
<div id="navinfo"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="/static/navigate.js"></script>
</body>
</html>
