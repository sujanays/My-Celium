<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MYCELIUM</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div id="app">
  <div id="map">
    <div class="scan-overlay"></div>
    <div class="topbar">
      <div class="brand">MYCELIUM<small>closed-loop industrial symbiosis</small></div>
      <div id="network-readout" class="network-readout" hidden></div>
    </div>
    <div class="controls">
      <button class="btn primary" id="btn-discover">⟡ DISCOVER</button>
      <button class="btn shock" id="btn-diesel">⚠ DIESEL +18%</button>
      <button class="btn shock" id="btn-tax">⚠ LANDFILL TAX ₹2000/t</button>
      <button class="btn reset" id="btn-reset">↺ RESET</button>
    </div>
    <div id="sidepanel"></div>
    <div id="legend">
      <div class="legend-chip active" data-layer="pair" style="--chip-color:#35e0c0">⟷ Pairs</div>
      <div class="legend-chip active" data-layer="cascade" style="--chip-color:#6bc7d9">⇢ Cascades</div>
      <div class="legend-chip active" data-layer="cycle" style="--chip-color:#ffb454">⟲ Closed Loop</div>
      <div class="legend-chip active" data-layer="ghost" style="--chip-color:#ff5d5d">✕ Blocked</div>
    </div>
    <div id="enginelog"></div>
    <div id="sysmonitor"><div class="sysmonitor-title">⚙ SYSTEM MONITOR <span class="sysmonitor-live">● LIVE</span></div><div id="sysmonitor-body"></div></div>
    <div class="hud">
      <div class="tile"><div class="label">₹ Saved / month</div><div class="value" id="hud-inr">0</div></div>
      <div class="tile"><div class="label">CO2 Avoided</div><div class="value amber" id="hud-co2">0 t</div></div>
      <div class="tile"><div class="label">Deals Closed</div><div class="value" id="hud-deals">0</div></div>
    </div>
  </div>
  <div id="theatre">
    <div class="theatre-header"><h2>Agent Theatre</h2></div>
    <div class="theatre-body" id="theatre-body">
      <div class="theatre-empty">Factories don't talk to each other.<br>We gave them a nervous system.<br><br>Click <b>DISCOVER</b> to begin.</div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
